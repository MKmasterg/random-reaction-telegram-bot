services:
  redis:
    image: redis:8.10.0-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10

  bot:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
